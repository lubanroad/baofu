<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="飽福餐飲大樓訂餐平台。連結知己知米與李鴻記兩大品牌，為企業員工提供便利的線上訂餐服務。">
<meta name="keywords" content="企業訂餐,大樓訂餐,健康便當,傳統便當,知己知米,李鴻記,台北訂餐">
<meta property="og:title" content="知己知米 × 李鴻記 訂餐平台">
<meta property="og:description" content="企業供餐新選擇。選擇您的大樓，輕鬆訂餐。當日送達，一份就送。">
<title>知己知米 × 李鴻記 訂餐平台</title>

  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-QQDB5YM3L0');
  gtag('config', 'AW-7321343734');

<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2900293833665700&ev=PageView&noscript=1" /></noscript>

<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#222;--muted:#6b6b6b;--line:#e7e3da;--zhi:#3f7d52;--li:#b23b2e;--line-green:#06c755;--gold:#9a6a00;--warn-bg:#fff6e0;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:520px;margin:0 auto;padding:22px 16px 48px}
  h1{font-size:25px;margin:6px 0}
  .step{font-size:12px;color:var(--muted);margin:20px 2px 8px;font-weight:700}
  .search input{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;font-size:15px}
  .list{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  button.bldg{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;cursor:pointer;font-family:inherit}
  .bldg:hover{border-color:var(--zhi)}
  .ic{flex:0 0 46px;height:46px;border-radius:12px;background:#eef3ee;display:flex;align-items:center;justify-content:center;font-size:22px}
  .bn{font-size:17px;font-weight:700}
  .ba{font-size:12px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
  .btn{display:block;color:#fff;font-size:17px;font-weight:700;padding:15px;border-radius:12px;border:none;cursor:pointer;width:100%;text-align:center;text-decoration:none}
  .btn-zhi{background:var(--zhi)}
  .btn-li{background:var(--li)}
  .line-btn{background:var(--line-green);color:#fff;padding:12px;border-radius:12px;text-decoration:none;display:block;text-align:center}
  .countdown{font-size:13px;color:var(--li);margin-top:8px;font-weight:700}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header style="text-align:center">
    <h1>知己知米 × 李鴻記 訂餐平台</h1>
  </header>

  <section id="step1">
    <div class="step">STEP 1 ・ 選擇大樓</div>
    <div class="search"><input id="q" type="text" placeholder="🔍 搜尋大樓…"></div>
    <div class="list" id="list"></div>
  </section>

  <section id="step2" class="hidden">
    <button id="backBtn" style="background:none;border:none;color:var(--zhi-d);cursor:pointer">← 返回</button>
    <div class="card">
      <div id="cName" style="font-weight:700"></div>
      <div id="cAddr" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
      <div class="countdown" id="countdown"></div>
    </div>

    <div class="card">
      <h2>知己知米</h2>
      <a class="btn btn-zhi" id="btnZhi" href="#" target="_blank" rel="noopener">訂餐 →</a>
    </div>

    <div class="card">
      <h2>李鴻記</h2>
      <a class="btn btn-li" id="btnLi" href="#" target="_blank" rel="noopener">訂餐 →</a>
    </div>

    <div class="card">
      <a class="line-btn" id="lineZhi" href="#" target="_blank">LINE@ 知己知米</a>
      <a class="line-btn" id="lineLi" href="#" target="_blank" style="margin-top:8px">LINE@ 李鴻記</a>
    </div>
  </section>
</div>

<script>
  const BUILDINGS=[
    {name:"新光金融大樓",addr:"臺北市松山區南京東路五段125號",pick:"新光金融大樓",code:"skfin",status:"live"},
    {name:"明志大樓",addr:"臺北市松山區民生東路四段54號",pick:"明志大樓",code:"mingzhi",status:"live"},
    {name:"聯邦企業大樓",addr:"臺北市松山區民生東路三段109號",pick:"聯邦企業大樓",code:"ms109",status:"live"},
    {name:"南山敦南大樓",addr:"臺北市大安區敦化南路一段2號",pick:"南山敦南大樓",code:"nanshan",status:"live"}
  ];
  const ICHEF={zhi:"https://shop.ichefpos.com/store/j3LVSING/ordering",li:"https://shop.ichefpos.com/store/Fy0w69An/ordering"};
  const LINEAT={zhi:"https://line.me/R/ti/p/@478bwqhr",li:"https://line.me/R/ti/p/@040gvtjv"};

  function renderList(items){
    const list=document.getElementById("list");
    list.innerHTML="";
    items.forEach(b=>{
      const el=document.createElement("button");
      el.className="bldg";
      el.innerHTML='<div class="ic">🏢</div><div><div class="bn">'+b.name+'</div><div class="ba">'+b.addr+'</div></div>';
      if(b.status==="live"){
        el.addEventListener("click",()=>choose(b));
      }
      list.appendChild(el);
    });
  }

  function apply(){
    const kw=document.getElementById("q").value.toLowerCase();
    const items=BUILDINGS.filter(b=>!kw||b.name.toLowerCase().includes(kw)||b.addr.toLowerCase().includes(kw));
    renderList(items);
  }

  function withUtm(base,code){
    const u=new URL(base);
    u.searchParams.set('utm_source','baofu_entry');
    u.searchParams.set('utm_campaign',code);
    return u.toString();
  }

  function updateCountdown(){
    const cd=document.getElementById("countdown");
    if(!cd)return;
    const now=new Date();
    const h=now.getHours(),m=now.getMinutes();
    if(h<9||(h===9&&m<30)){
      const remain=(9*60+30)-(h*60+m);
      const hh=Math.floor(remain/60),mm=remain%60;
      cd.textContent="⏰ 截單倒數："+hh+"h "+mm+"m";
    }else{
      cd.textContent="⏰ 已截單";
    }
  }

  function choose(b){
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
    document.getElementById("cName").textContent=b.name;
    document.getElementById("cAddr").textContent=b.addr;
    document.getElementById("btnZhi").href=withUtm(ICHEF.zhi,b.code);
    document.getElementById("btnLi").href=withUtm(ICHEF.li,b.code);
    document.getElementById("lineZhi").href=LINEAT.zhi;
    document.getElementById("lineLi").href=LINEAT.li;
    localStorage.setItem("lastBuilding",JSON.stringify(b));
    updateCountdown();
    setInterval(updateCountdown,30000);
    gtag('event','building_selected',{building:b.name});
    fbq('track','InitiateCheckout',{content_name:b.name});
  }

  document.getElementById("backBtn").addEventListener("click",()=>{
    document.getElementById("step2").classList.add("hidden");
    document.getElementById("step1").classList.remove("hidden");
  });

  document.getElementById("q").addEventListener("input",apply);
  
  document.getElementById("btnZhi").addEventListener("click",()=>{gtag('event','brand_clicked',{brand:'知己知米'});fbq('track','ViewContent',{content_name:'知己知米'});});
  document.getElementById("btnLi").addEventListener("click",()=>{gtag('event','brand_clicked',{brand:'李鴻記'});fbq('track','ViewContent',{content_name:'李鴻記'});});

  const bp=new URLSearchParams(location.search).get("b");
  if(bp){const found=BUILDINGS.find(x=>x.code===bp);if(found)choose(found);}else{const saved=localStorage.getItem("lastBuilding");if(saved){try{choose(JSON.parse(saved));}catch(e){}}}
  
  apply();
</script>
</body>
</html>
